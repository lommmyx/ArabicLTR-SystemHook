name: Build ArabicLTR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Select build variant and prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD_SECRET" && -z "$KEY_ALIAS_SECRET" && -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/arabicltr-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/arabicltr-signing/release.p12"
          umask 077
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD_SECRET" && -n "$KEY_ALIAS_SECRET" && -n "$KEY_PASSWORD_SECRET" ]] || {
            echo "All four signing secrets must be configured together." >&2
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"
          chmod 600 "$KEYSTORE_PATH"
          echo "variant=release" >> "$GITHUB_OUTPUT"

      - name: Validate source metadata and scripts
        run: bash scripts/validate-source.sh

      - name: Run lint and build APK
        shell: bash
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: bash ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease ":app:assemble${VARIANT^}"

      - name: Verify APK and module metadata
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          for entry in META-INF/xposed/module.prop META-INF/xposed/java_init.list META-INF/xposed/scope.list; do
            unzip -Z1 "$APK" | grep -Fxq "$entry"
          done
          unzip -p "$APK" META-INF/xposed/module.prop
          unzip -p "$APK" META-INF/xposed/java_init.list
          unzip -p "$APK" META-INF/xposed/scope.list
          sha256sum "$APK"
          cp "$APK" "$RUNNER_TEMP/ArabicLTR-SystemHook-$VARIANT.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLTR-SystemHook-${{ steps.signing.outputs.variant }}
          path: ${{ runner.temp }}/ArabicLTR-SystemHook-${{ steps.signing.outputs.variant }}.apk
          if-no-files-found: error
